{% extends "core/base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<h1 class="page-title mb-3">Смена пароля</h1>
<div class="card" style="max-width:480px"><div class="card-body">
<form method="post">{% csrf_token %}
  {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>
    <input type="password" name="{{ field.html_name }}" class="form-control" required>
    {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
  <button class="btn btn-primary">Сменить</button>
</form>
</div></div>
{% endblock %}
